header:
  version: 17

build_system: isar-privileged

distro: debian-trixie
machine: qemuamd64
target: demo-image

repos:
  isar-demo:
    layers:
      meta-demo:

  isar:
    url: https://github.com/ilbers/isar.git
    branch: master
    layers:
      meta:
      meta-isar:

  isar-cip-core:
    url: https://gitlab.com/cip-project/cip-core/isar-cip-core.git
    branch: master

local_conf_header:
  debian-13.6-snapshot: |
    ISAR_USE_APT_SNAPSHOT = "1"
    ISAR_APT_SNAPSHOT_DATE = "20260801T022406Z"
  image-format: |
    IMAGE_FSTYPES = "wic.zst"
